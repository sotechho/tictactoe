apiVersion: v1
kind: Service
metadata:
  name: tic-tac-toe-nodeport-service
spec:
  type: NodePort
  selector:
    app: tic-tac-toe   # Must match the labels on your Pods
  ports:
    - protocol: TCP
      port: 80         # Internal ClusterIP port
      targetPort: 80   # Port the container is listening on
      nodePort: 30080  # Optional: Static external port (30000-32767). Auto-assigned if omitted.
